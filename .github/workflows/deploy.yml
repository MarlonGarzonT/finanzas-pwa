name: Página de mudanza en GitHub Pages

# La app se publica en Vercel (micuadre-app.vercel.app) con cada push a main.
# El link viejo de GitHub Pages ya no publica la app: solo la página de
# mudanza (carpeta mudanza/), que lleva a la dirección nueva y reemplaza el
# Service Worker viejo para que las apps instaladas no sigan con su copia.
on:
  push:
    branches: [main]
    paths:
      - 'mudanza/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cualquier ruta vieja (marcadores, enlaces de correo) también lleva a
      # la página de mudanza.
      - run: cp mudanza/index.html mudanza/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mudanza

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
